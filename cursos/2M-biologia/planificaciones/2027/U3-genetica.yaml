    y la meiosis. • Las causas y consecuencias de anomalías y pérdida de control de la división celular
    (tumor, cáncer, trisomía, entre otros).'
- oa: OA7
  texto: Desarrollar una explicación científica, basada en evidencias, sobre los procesos de herencia
    genética en plantas y animales, aplicando los principios básicos de la herencia propuestos por Mendel.
