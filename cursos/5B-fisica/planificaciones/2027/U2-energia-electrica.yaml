# Quinto Básico · Física · 2027 — generado desde el borrador anual; editar aquí.
estado: borrador
version: 1
anio: 2027
encabezado:
  unidad: 'UNIDAD II: Energía eléctrica'
  profesor: Felipe Jiménez
  curso: Quinto Básico
  asignatura: Física
  mes: Junio a diciembre
proposito: Reconocer las transformaciones de la energía eléctrica, construir circuitos simples, distinguir
  materiales conductores y aisladores para un uso seguro de la electricidad, y proponer medidas de ahorro
  y uso responsable.
objetivos:
- oa: OA8
  texto: Reconocer los cambios que experimenta la energía eléctrica al pasar de una forma a otra (eléctrica
    a calórica, sonora, lumínica etc.) e investigar los principales aportes de científicos en su estudio
    a través del tiempo.
- oa: OA9
  texto: Construir un circuito eléctrico simple (cable, ampolleta, interruptor y pila), usarlo para resolver
    problemas cotidianos y explicar su funcionamiento.
- oa: OA10
  texto: Observar y distinguir, por medio de la investigación experimental, los materiales conductores
    (cobre y aluminio) y aisladores (plásticos y goma) de electricidad, relacionándolos con la manipulación
    segura de artefactos tecnológicos y circuitos eléctricos domiciliarios.
- oa: OA11
  texto: Explicar la importancia de la energía eléctrica en la vida cotidiana y proponer medidas para
    promover su ahorro y uso responsable.
