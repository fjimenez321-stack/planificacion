# Quinto Básico · Física · 2027 — generado desde el borrador anual; editar aquí.
estado: borrador
version: 1
anio: 2027
encabezado:
  unidad: 'UNIDAD I: El agua en la Tierra y los océanos'
  profesor: Felipe Jiménez
  curso: Quinto Básico
  asignatura: Física
  mes: Marzo a junio
proposito: Describir la distribución del agua dulce y salada en la Tierra y las características de océanos
  y lagos, e investigar los efectos de la actividad humana sobre las reservas de agua, proponiendo acciones
  para protegerlas en Chile.
objetivos:
- oa: OA12
  texto: Describir la distribución del agua dulce y salada en la Tierra, considerando océanos, glaciares,
    ríos y lagos, aguas subterráneas, nubes, vapor de agua, etc. y comparar sus volúmenes, reconociendo
    la escasez relativa de agua dulce.
- oa: OA13
  texto: 'Analizar y describir las características de los océanos y lagos: • variación de temperatura,
    luminosidad y presión en relación con la profundidad • diversidad de flora y fauna • movimiento de
    las aguas, como olas, mareas, corrientes (El Niño y Humboldt)'
- oa: OA14
  texto: Investigar y explicar efectos positivos y negativos de la actividad humana en los océanos, lagos,
    ríos, glaciares, entre otros, proponiendo acciones de protección de las reservas hídricas en Chile
    y comunicando sus resultados.
duracion: 15 semanas (30 horas pedagógicas)
