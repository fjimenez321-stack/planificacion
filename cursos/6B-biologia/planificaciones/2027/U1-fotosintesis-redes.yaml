anio: 2027
encabezado:
  unidad: 'UNIDAD I: Fotosíntesis y redes alimentarias'
  profesor: Felipe Jiménez
  curso: Sexto Básico
  asignatura: Biología
  mes: Marzo a junio
proposito: Explicar, a partir de la investigación experimental, los requerimientos de la fotosíntesis,
  representar con modelos la transferencia de materia y energía en cadenas y redes alimentarias, y analizar
  los efectos de la actividad humana sobre ellas.
objetivos:
- oa: OA1
  texto: Explicar, a partir de una investigación experimental, los requerimientos de agua, dióxido de
    carbono y energía lumínica para la producción de azúcar y liberación de oxígeno en la fotosíntesis,
    comunicando sus resultados y los aportes de científicos en este campo a través del tiempo.
- oa: OA2
  texto: Representar, por medio de modelos, la transferencia de energía y materia desde los organismos
    fotosintéticos a otros seres vivos por medio de cadenas y redes alimentarias en diferentes ecosistemas.
- oa: OA3
  texto: Analizar los efectos de la actividad humana sobre las redes alimentarias.
duracion: 15 semanas (30 horas pedagógicas)
semanas:
