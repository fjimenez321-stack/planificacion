  oa:
  - OA1
  tema: ¿Cómo se alimentan las plantas?
  actividades: 'Diagnóstico. Lectura del experimento de van Helmont y discusión: ¿de dónde sale la masa
    del árbol?'
  objetivos_especificos: Reconocer ideas previas sobre la nutrición de las plantas.
  bloom: Recordar / Comprender
  evaluacion_formativa: Ticket de salida
- semana: 2
  oa:
  - OA1
  tema: 'Experimento: luz'
  actividades: Plantas con y sin luz durante la semana (registro); hojas tapadas con papel aluminio y
