proposito: Identificar las estructuras y funciones del sistema reproductor humano, describir los cambios
  de la pubertad como etapa del desarrollo, reconocer los beneficios de la actividad física y la higiene,
  e investigar los efectos nocivos de las drogas proponiendo conductas de protección.
objetivos:
- oa: OA4
  texto: Identificar y describir las funciones de las principales estructuras del sistema reproductor
    humano femenino y masculino.
- oa: OA5
  texto: Describir y comparar los cambios que se producen en la pubertad en mujeres y hombres, reconociéndola,
    como una etapa del desarrollo humano.
- oa: OA6
  texto: Reconocer los beneficios de realizar actividad física en forma regular y de cuidar la higiene
    corporal en el período de la pubertad.
- oa: OA7
  texto: Investigar y comunicar los efectos nocivos de algunas drogas para la salud, proponiendo conductas
    de protección.
