proposito: Describir las capas de la Tierra que posibilitan la vida, investigar experimentalmente la formación
  y las propiedades del suelo, y explicar las consecuencias de la erosión, proponiendo medidas de protección.
objetivos:
- oa: OA16
  texto: Describir las características de las capas de la Tierra (atmósfera, litósfera e hidrósfera) que
    posibilitan el desarrollo de la vida y proveen recursos para el ser humano, y proponer medidas de
    protección de dichas capas.
- oa: OA17
  texto: Investigar experimentalmente la formación del suelo, sus propiedades (como color, textura y capacidad
    de retención de agua) y la importancia de protegerlo de la contaminación, comunicando sus resultados.
- oa: OA18
  texto: Explicar las consecuencias de la erosión sobre la superficie de la Tierra, identificando los
    agentes que la provocan, como el viento, el agua y las actividades humanas.
