# Sexto Básico · Física · 2027 — generado desde el borrador anual; editar aquí.
estado: borrador
version: 1
anio: 2027
encabezado:
  unidad: 'UNIDAD II: Energía y sus transformaciones'
  profesor: Felipe Jiménez
  curso: Sexto Básico
  asignatura: Física
  mes: Mayo a septiembre
proposito: Explicar que la energía es necesaria para los cambios y los procesos vitales y que proviene
  en su mayoría del Sol, investigar experimentalmente sus transformaciones y el flujo de calor, y clasificar
  los recursos energéticos proponiendo un uso responsable.
objetivos:
- oa: OA8
  texto: Explicar que la energía es necesaria para que los objetos cambien y los seres vivos realicen
    sus procesos vitales y que la mayoría de los recursos energéticos proviene directa o indirectamente
    del Sol, dando ejemplos de ello.
- oa: OA9
  texto: Investigar en forma experimental la transformación de la energía de una forma a otra, dando ejemplos
    y comunicando sus conclusiones.
- oa: OA10
  texto: Demostrar, por medio de la investigación experimental, que el calor fluye de un objeto caliente
    a uno frío hasta que ambos alcanzan la misma temperatura.
- oa: OA11
  texto: Clasificar los recursos naturales energéticos en no renovables y renovables y proponer medidas
    para el uso responsable de la energía.
duracion: 14 semanas (28 horas pedagógicas)
