  mes: Septiembre a diciembre
proposito: Explicar con modelos que la materia está formada por partículas en movimiento, demostrar experimentalmente
  los cambios de estado, diferenciar calor y temperatura, e interpretar mediciones al calentar y enfriar
  agua.
objetivos:
- oa: OA12
  texto: Explicar, a partir de modelos, que la materia está formada por partículas en movimiento en sus
    estados sólido, líquido y gaseoso.
- oa: OA13
  texto: Demostrar, mediante la investigación experimental, los cambios de estado de la materia, como
    fusión, evaporación, ebullición, condensación, solidificación y sublimación.
- oa: OA14
  texto: Diferenciar entre calor y temperatura, considerando que el calor es una forma de energía y la
    temperatura es una medida de lo caliente de un objeto.
- oa: OA15
  texto: Medir e interpretar la información obtenida al calentar y enfriar el agua, considerando las transformaciones
    de un estado a otro.
