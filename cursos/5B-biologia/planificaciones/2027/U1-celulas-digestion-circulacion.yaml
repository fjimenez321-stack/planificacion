  objetivos_especificos: Clasificar alimentos según su función en el cuerpo.
  bloom: Comprender
  evaluacion_formativa: Clasificación de alimentos
- semana: 18
  oa:
  - OA5
  tema: Porciones y frecuencia
  actividades: 'Análisis del diario: variedad, tamaño y frecuencia de porciones; sellos ''ALTO EN'' en
