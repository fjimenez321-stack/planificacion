  objetivos_especificos: Describir la estructura y función del corazón.
  bloom: Comprender
  evaluacion_formativa: Tabla de pulsaciones
- semana: 12
  oa:
  - OA4
  tema: Vasos sanguíneos y sangre
  actividades: Arterias, venas y capilares; componentes de la sangre (modelo en frasco con cereales y
    dulces).
  objetivos_especificos: Identificar los vasos sanguíneos y los componentes de la sangre.
  bloom: Comprender
  evaluacion_formativa: Modelo de sangre rotulado
- semana: 13
  oa:
  - OA4
  tema: Función de transporte
  actividades: 'Juego de roles en el patio: glóbulos que transportan oxígeno, nutrientes y dióxido de
    carbono entre ''pulmones'', ''intestino'' y ''células''.'
  objetivos_especificos: Explicar la función de transporte del sistema circulatorio.
  bloom: Aplicar
  evaluacion_formativa: Diagrama del recorrido
- semana: 14
  oa:
  - OA4
  tema: Circulación e integración de sistemas
  actividades: Relación entre los sistemas digestivo y circulatorio (nutrientes) y anticipo del respiratorio
