# Quinto Básico · Biología · 2027 — generado desde el borrador anual; editar aquí.
estado: borrador
version: 1
anio: 2027
encabezado:
  unidad: 'UNIDAD I: Cuerpo humano: células, digestión y circulación'
  profesor: Felipe Jiménez
  curso: Quinto Básico
  asignatura: Biología
  mes: Marzo a agosto
proposito: Reconocer que los seres vivos están formados por células organizadas en tejidos, órganos y
  sistemas, y explicar con modelos la estructura y función de los sistemas digestivo y circulatorio, relacionándolos
  con una alimentación saludable.
objetivos:
- oa: OA1
  texto: Reconocer y explicar que los seres vivos están formados por una o más células y que estas se
    organizan en tejidos, órganos y sistemas.
- oa: OA2
  texto: Identificar y describir por medio de modelos las estructuras básicas del sistema digestivo (boca,
    esófago, estómago, hígado, intestino delgado, intestino grueso, recto y ano) y sus funciones en la
    digestión, la absorción de alimentos y la eliminación de desechos.
- oa: OA4
  texto: Explicar la función de transporte del sistema circulatorio (sustancias alimenticias, oxígeno
    y dióxido de carbono), identificando sus estructuras básicas (corazón, vasos sanguíneos y sangre).
- oa: OA5
  texto: Analizar el consumo de alimento diario (variedad, tamaño y frecuencia de porciones) reconociendo
    los alimentos para el crecimiento, la reparación, el desarrollo y el movimiento del cuerpo.
duracion: 21 semanas (42 horas pedagógicas)
semanas:
- semana: 1
  oa:
  - OA1
  tema: ¿De qué estamos hechos?
  actividades: 'Diagnóstico con dibujo libre del interior del cuerpo. Normas del laboratorio. Lupas: observación
    de hojas, piel de cebolla y tela.'
  objetivos_especificos: Reconocer ideas previas sobre la constitución de los seres vivos.
  bloom: Recordar
  evaluacion_formativa: Dibujo diagnóstico + ticket de salida
- semana: 2
  oa:
  - OA1
  tema: La célula
  actividades: 'Uso del microscopio: células de cebolla y de mucosa bucal (o imágenes). Partes básicas
    de la célula.'
  objetivos_especificos: Identificar la célula como unidad de los seres vivos.
  bloom: Comprender
  evaluacion_formativa: Dibujo científico rotulado
- semana: 3
  oa:
  - OA1
  tema: Unicelulares y pluricelulares
  actividades: Observación de agua de charco o imágenes de protozoos; comparación con organismos pluricelulares.
  objetivos_especificos: Distinguir organismos unicelulares y pluricelulares.
  bloom: Comprender
  evaluacion_formativa: Cuadro comparativo
- semana: 4
  oa:
  - OA1
  tema: Niveles de organización
  actividades: 'Modelo de muñecas rusas o cajas: célula → tejido → órgano → sistema → organismo. Juego
    de tarjetas.'
  objetivos_especificos: Ordenar los niveles de organización de los seres vivos.
  bloom: Aplicar
  evaluacion_formativa: Organizador gráfico
- semana: 5
  oa:
  - OA1
  tema: Evaluación OA1
  actividades: Evaluación escrita breve del OA1 y retroalimentación.
  objetivos_especificos: Evaluar la comprensión de la organización celular.
  bloom: Evaluar
  evaluacion_formativa: Evaluación sumativa N°1 (OA1)
- semana: 6
  oa:
  - OA2
  tema: ¿Qué pasa con lo que comemos?
  actividades: 'Ideas previas: recorrido del alimento. Estructuras del sistema digestivo en una silueta
    a tamaño real.'
  objetivos_especificos: Identificar las estructuras del sistema digestivo.
  bloom: Recordar / Comprender
  evaluacion_formativa: Silueta rotulada
- semana: 7
  oa:
  - OA2
  tema: Digestión mecánica y química
  actividades: 'Experimento: galleta en bolsa con agua (masticación) y pan con saliva (sabor dulce).'
  objetivos_especificos: Describir la digestión mecánica y química.
  bloom: Comprender
  evaluacion_formativa: Ficha de experimento
- semana: 8
  oa:
  - OA2
  tema: Modelo del tubo digestivo
  actividades: Modelo con medias, bolsas y embudo para representar el recorrido del alimento.
  objetivos_especificos: Representar con un modelo la digestión y la absorción.
  bloom: Aplicar
  evaluacion_formativa: Modelo con explicación oral
- semana: 9
  oa:
  - OA2
  tema: Absorción y eliminación
  actividades: Intestino delgado y vellosidades (toalla doblada); intestino grueso, recto y ano.
  objetivos_especificos: Explicar la absorción de nutrientes y la eliminación de desechos.
  bloom: Comprender / Aplicar
  evaluacion_formativa: Ticket de salida
- semana: 10
  oa:
  - OA2
  tema: Evaluación OA2
  actividades: Presentación de modelos y evaluación escrita del OA2.
  objetivos_especificos: Evaluar la comprensión del sistema digestivo.
  bloom: Evaluar
  evaluacion_formativa: Evaluación sumativa N°2 (OA2) + rúbrica del modelo
- semana: 11
  oa:
  - OA4
  tema: El corazón
  actividades: Medición del pulso en reposo y después de saltar; registro en tabla. Estructura del corazón
