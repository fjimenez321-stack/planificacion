  - OA1
  - OA2
  - OA4
  - OA5
  tema: Cierre de unidad
  actividades: 'Evaluación integradora: el viaje de un alimento desde la boca hasta las células.'
  objetivos_especificos: Evaluar e integrar los aprendizajes de la unidad.
  bloom: Evaluar
  evaluacion_formativa: Evaluación sumativa N°4 (OA5 e integración)
nota:
  titulo: Nota sobre la gradación de Bloom
