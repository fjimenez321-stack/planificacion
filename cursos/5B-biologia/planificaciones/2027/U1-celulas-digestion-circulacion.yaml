  objetivos_especificos: Relacionar el sistema circulatorio con otros sistemas.
  bloom: Analizar
  evaluacion_formativa: Mapa conceptual
- semana: 15
  oa:
  - OA4
  tema: Evaluación OA4
  actividades: Evaluación escrita del OA4.
  objetivos_especificos: Evaluar la comprensión del sistema circulatorio.
  bloom: Evaluar
  evaluacion_formativa: Evaluación sumativa N°3 (OA4)
- semana: 16
  oa:
  - OA5
  tema: ¿Qué comemos?
  actividades: Registro de lo que comen en un día (diario de alimentación). Grupos de alimentos.
  objetivos_especificos: Identificar los grupos de alimentos en su dieta.
  bloom: Recordar / Comprender
  evaluacion_formativa: Diario de alimentación
- semana: 17
  oa:
  - OA5
  tema: Función de los alimentos
  actividades: Alimentos para crecer, reparar, dar energía y moverse; guía alimentaria y plato saludable
