  objetivos_especificos: Analizar su consumo diario de alimentos.
  bloom: Analizar
  evaluacion_formativa: Análisis guiado del diario
- semana: 19
  oa:
  - OA5
  tema: Colaciones saludables
  actividades: Diseño de un menú o colación saludable para el curso con presupuesto.
  objetivos_especificos: Proponer una alimentación equilibrada.
  bloom: Aplicar / Crear
  evaluacion_formativa: Menú con retroalimentación
- semana: 20
  oa:
  - OA5
  tema: Feria de alimentación
  actividades: Presentación de menús saludables a otro curso.
