  oa:
  - OA14
  tema: Mareas
  actividades: Modelo de las mareas con la Luna y el Sol; tablas de mareas de Valparaíso (SHOA).
  objetivos_especificos: Explicar el origen de las mareas con la gravitación universal.
  bloom: Aplicar / Analizar
  evaluacion_formativa: Análisis de tabla de mareas
- semana: 7
  oa:
  - OA14
  tema: Satélites y viajes espaciales
  actividades: Órbitas de satélites y sondas; ventajas y desventajas de los campos gravitacionales en
