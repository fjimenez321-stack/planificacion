  objetivos_especificos: Describir el MRUA y aplicar sus ecuaciones.
  bloom: Aplicar
  evaluacion_formativa: Ejercicios de MRUA
- semana: 7
  oa:
  - OA9
  tema: Evaluación N°1
  actividades: Evaluación escrita de conceptos, MRU y gráficos. Retroalimentación.
  objetivos_especificos: Evaluar la comprensión del MRU y de sus gráficos.
  bloom: Evaluar
  evaluacion_formativa: 'Evaluación sumativa N°1 (OA9: MRU)'
- semana: 8
  oa:
  - OA9
  tema: Caída libre y lanzamiento vertical
  actividades: Galileo y la aceleración de gravedad (historia). Medición de g con una regla que cae (tiempo
