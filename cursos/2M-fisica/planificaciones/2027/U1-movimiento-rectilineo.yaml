encabezado:
  unidad: 'UNIDAD I: Movimiento rectilíneo'
  profesor: Felipe Jiménez
  curso: Segundo Medio
  asignatura: Física
  mes: Marzo a mayo
proposito: Analizar, sobre la base de la experimentación, el movimiento rectilíneo uniforme y acelerado
  de objetos respecto de un sistema de referencia, usando herramientas gráficas y analíticas en situaciones
  cotidianas.
objetivos:
- oa: OA9
  texto: Analizar, sobre la base de la experimentación, el movimiento rectilíneo uniforme y acelerado
    de un objeto respecto de un sistema de referencia espacio-temporal, considerando variables como la
    posición, la velocidad y la aceleración en situaciones cotidianas.
duracion: 10 semanas (20 horas pedagógicas)
semanas:
- semana: 1
  oa:
  - OA9
  tema: Relatividad del movimiento
  actividades: 'KPSI. Actividad del programa: estudiante corre y suelta una pelota; descripción desde
    distintos observadores. Sistemas de referencia y coordenadas.'
  objetivos_especificos: Explicar por qué es necesario un sistema de referencia para describir un movimiento.
  bloom: Recordar / Comprender
  evaluacion_formativa: KPSI + ticket de salida
- semana: 2
  oa:
  - OA9
  tema: Conceptos de cinemática
  actividades: Posición, desplazamiento, distancia recorrida y tiempo con recorridos en el patio sobre
    una huincha. Diferencia entre rapidez y velocidad.
  objetivos_especificos: Diferenciar conceptos de cinemática en situaciones cotidianas.
  bloom: Comprender
  evaluacion_formativa: Guía conceptual
- semana: 3
  oa:
  - OA9
  tema: Adición de velocidades de Galileo
  actividades: Casos de vehículos que se mueven en la misma dirección o en sentidos opuestos; cinta transportadora
    o pasillo móvil.
  objetivos_especificos: Aplicar la adición de velocidades de Galileo en situaciones simples.
  bloom: Aplicar
  evaluacion_formativa: Ejercicios resueltos en clase
- semana: 4
  oa:
  - OA9
  tema: MRU experimental
  actividades: 'Burbuja en un tubo con aceite o auto a pilas: medición de posición y tiempo, gráfico x–t
    y cálculo de la pendiente.'
  objetivos_especificos: Analizar el MRU a partir de datos experimentales y gráficos.
  bloom: Aplicar / Analizar
  evaluacion_formativa: Informe breve de laboratorio
- semana: 5
  oa:
  - OA9
  tema: Gráficos de movimiento
  actividades: Lectura e interpretación de gráficos x–t y v–t; app Phyphox o simulación PhET 'El hombre
