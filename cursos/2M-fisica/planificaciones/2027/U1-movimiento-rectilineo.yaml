  objetivos_especificos: Interpretar gráficos de movimiento rectilíneo.
  bloom: Analizar
  evaluacion_formativa: Guía de gráficos diferenciada
- semana: 6
  oa:
  - OA9
  tema: Aceleración y MRUA
  actividades: Carro en un plano inclinado con marcas de tiempo (video en cámara lenta); concepto de aceleración
